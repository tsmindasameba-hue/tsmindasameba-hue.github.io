const NUM = "①②③④⑤";
const app = document.getElementById("app");
let idx = 0;
const mcqResults = {};   // 번호 -> true/false
const selfResults = {};  // 번호 -> true/false (단답·서술형 스스로 확인)

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids) e.append(c);
  return e;
}

function header() {
  const done = idx;
  return [
    el("div", { class: "bar" }, el("div", { style: "width:" + (done / Q.length * 100) + "%" })),
    el("div", { class: "meta" }, el("span", {}, `${Math.min(idx + 1, Q.length)} / ${Q.length}번`), el("span", {}, "")),
  ];
}

function feedback(q, head, cls) {
  const box = el("div", { class: "fb " + cls });
  box.append(el("h3", {}, head));
  box.append(el("p", {}, "정답: " + q.answer));
  box.append(el("p", {}, "해설: " + q.explain));
  if (q.rubric && q.rubric.length) {
    box.append(el("p", {}, q.rubricTitle));
    const ul = el("ul");
    q.rubric.forEach(r => ul.append(el("li", {}, r)));
    box.append(ul);
  }
  box.append(el("p", { class: "src" }, "근거: " + q.source));
  return box;
}

function show() {
  app.replaceChildren();
  if (idx >= Q.length) return showEnd();
  const q = Q[idx];
  header().forEach(h => app.append(h));
  const card = el("div", { class: "card" });
  card.append(el("p", { class: "stem" }, `${q.n}. ${q.stem}`));
  const next = el("button", { class: "main hidden" }, idx === Q.length - 1 ? "결과 보기" : "다음 문제");
  next.addEventListener("click", () => { idx++; show(); });

  if (q.kind === "mcq") {
    const btns = q.opts.map((o, i) => {
      const b = el("button", { class: "opt" }, o);
      b.addEventListener("click", () => {
        const ok = i === q.correct;
        mcqResults[q.n] = ok;
        btns.forEach((x, j) => { x.disabled = true; if (j === q.correct) x.classList.add("correct"); });
        if (!ok) b.classList.add("wrong");
        card.append(feedback(q, ok ? "정답입니다!" : "아쉬워요. 다시 확인해 봐요.", ok ? "ok" : "no"));
        next.classList.remove("hidden");
        card.append(next);
      });
      card.append(b);
      return b;
    });
  } else {
    const ta = el("textarea", { placeholder: "내 답을 써 보세요." });
    const check = el("button", { class: "main" }, "정답 확인하기");
    card.append(ta, check);
    check.addEventListener("click", () => {
      ta.disabled = true; check.remove();
      card.append(feedback(q, "정답과 해설을 보고, 내 답과 비교해 보세요.", ""));
      const row = el("div");
      const mk = (label, val) => {
        const b = el("button", { class: "alt" }, label);
        b.addEventListener("click", () => {
          selfResults[q.n] = val;
          row.remove(); next.classList.remove("hidden"); card.append(next);
        });
        return b;
      };
      row.append(el("p", { class: "note" }, "내 답이 정답과 맞았나요? (스스로 확인)"), mk("맞았어요", true), mk("아쉬웠어요", false));
      card.append(row);
    });
  }
  app.append(card);
}

function showEnd() {
  const mcq = Q.filter(q => q.kind === "mcq");
  const txt = Q.filter(q => q.kind === "text");
  const mOk = mcq.filter(q => mcqResults[q.n]).length;
  const tOk = txt.filter(q => selfResults[q.n]).length;
  app.append(el("div", { class: "bar" }, el("div", { style: "width:100%" })));
  const card = el("div", { class: "card", style: "margin-top:14px" });
  card.append(el("h2", { style: "margin-top:0" }, "수고했어요!"));
  card.append(el("p", {}, `객관식 ${mcq.length}문항 중 ${mOk}개를 맞혔어요.`));
  card.append(el("p", {}, `단답·서술형 ${txt.length}문항 중 ${tOk}개는 스스로 «맞았어요»로 확인했어요.`));
  card.append(el("label", { for: "sid" }, "학번"));
  card.append(el("input", { type: "text", id: "sid", autocomplete: "off" }));
  card.append(el("label", { for: "sname" }, "이름"));
  card.append(el("input", { type: "text", id: "sname", autocomplete: "off" }));
  const err = el("div", { class: "err" });
  const go = el("button", { class: "main" }, "결과 카드 만들기");
  go.addEventListener("click", () => {
    const sid = document.getElementById("sid").value.trim();
    const sname = document.getElementById("sname").value.trim();
    if (!sid || !sname) { err.textContent = "학번과 이름을 모두 입력해 주세요."; return; }
    const d = new Date();
    const r = el("div", { class: "result" });
    r.append(el("div", {}, "11주차 복습 퀴즈 결과"));
    r.append(el("div", { class: "big" }, `객관식 ${mOk} / ${mcq.length}`));
    r.append(el("div", {}, `단답·서술형 스스로 확인 ${tOk} / ${txt.length}`));
    r.append(el("p", {}, `학번 ${sid} · 이름 ${sname}`));
    r.append(el("div", { class: "note" }, `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`));
    r.append(el("div", { class: "note noprint" }, "이 결과는 이 화면에서만 보이며 어디에도 저장되거나 전송되지 않아요. 교수님께 알리려면 화면을 캡처하거나 인쇄해서 내 주세요."));
    app.replaceChildren(r);
  });
  card.append(err, go);
  app.append(card);
}

show();
</script>
</body>
